<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PPE Guard</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    try { const t = localStorage.getItem("ppe-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-live" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21.5 7v10l-6-3.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3.5 20.5h17"/><rect x="5.5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="6" width="3" height="12" rx="1"/><rect x="15.5" y="13.5" width="3" height="4.5" rx="1"/></symbol>
      <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 2.5h8.5L19 7v14.5H6z"/><path d="M14 2.5V7.5h5M9 12h7M9 15.5h7M9 19h4"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v4.5h16V15"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H5.5v15H14"/><path d="M10 12h10.5M17 8.5l3.5 3.5-3.5 3.5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-zone" viewBox="0 0 24 24"><path d="M4 7l7-3.5 9 4.5-2.5 11L6 18z"/><circle cx="4" cy="7" r="1.3"/><circle cx="11" cy="3.5" r="1.3"/><circle cx="20" cy="8" r="1.3"/><circle cx="17.5" cy="19" r="1.3"/><circle cx="6" cy="18" r="1.3"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M6.5 6.5l1 14h9l1-14"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11.5M7.5 11 12 15.5l4.5-4.5M4 19.5h16"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7.5 4.5v15M16.5 4.5v15M3 9.5h4.5M3 14.5h4.5M16.5 9.5H21M16.5 14.5H21"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3.5 17.5l5-5 4 4 3-3 5 5"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14.5h10V21H7z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-hardhat" viewBox="0 0 24 24"><path d="M3 17.5h18v2.5H3z"/><path d="M5 17.5a7 7 0 0 1 14 0"/><path d="M10 10.8V7.5h4v3.3"/></symbol>
    </defs>
  </svg>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/live" aria-label="PPE Guard home">
        <img src="/static/favicon.svg" alt="" width="28" height="28">
        <span><strong>PPE Guard</strong><small id="site-name">&nbsp;</small></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/live" data-nav="live"><svg class="ic"><use href="#i-live"/></svg>Live</a>
        <a href="#/violations" data-nav="violations"><svg class="ic"><use href="#i-alert"/></svg>Violations<span class="nav-badge" id="badge-unack" hidden></span></a>
        <a href="#/analytics" data-nav="analytics"><svg class="ic"><use href="#i-chart"/></svg>Analytics</a>
        <a href="#/reports" data-nav="reports"><svg class="ic"><use href="#i-report"/></svg>Reports</a>
        <a href="#/analyze" data-nav="analyze"><svg class="ic"><use href="#i-upload"/></svg>Analyze</a>
        <a href="#/settings" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <span class="conn" id="conn" title="Live connection"><i></i><span>connecting</span></span>
        <div class="row-tight">
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme" title="Switch theme"><svg class="ic"><use href="#i-moon"/></svg></button>
          <button class="icon-btn" id="logout-btn" type="button" aria-label="Log out" title="Log out" hidden><svg class="ic"><use href="#i-logout"/></svg></button>
        </div>
      </div>
    </aside>

    <header class="topbar">
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Open menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <span class="topbar-title"><img src="/static/favicon.svg" alt="" width="22" height="22"> PPE Guard</span>
      <span class="conn" id="conn-m"><i></i></span>
    </header>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog id="dialog" class="dialog"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
