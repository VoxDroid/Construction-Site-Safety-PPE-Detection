name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "CHANGELOG.md", "CONTRIBUTING.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The browser demo loads this model; it lives in the release, not in the repository.
  DEMO_MODEL_URL: https://github.com/VoxDroid/ppe-guard/releases/download/v2.0.0/ppe-yolo26s.onnx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5,<10"
      - name: Fetch the demo model
        run: curl -fsSL -o docs/demo/ppe-yolo26s.onnx "$DEMO_MODEL_URL"
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A separate job: deploying in the same job as the upload sometimes ran before the
  # artifact was registered ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
