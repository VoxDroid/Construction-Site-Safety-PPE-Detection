name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Dashboard (ppe-guard serve)
        - Command line (predict, train, val, ...)
        - Docker
        - Browser demo
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ppe-guard predict path/to/video.mp4 --show
        2. ...
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ppe-guard doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
