[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ppe-guard"
version = "2.0.1"
description = "Real-time PPE compliance monitoring for construction sites: YOLO detection, per-worker tracking, violation logging and alerts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Izeno" }]
requires-python = ">=3.10"
keywords = ["ppe", "ppe-detection", "construction-safety", "yolo", "object-detection", "computer-vision", "tracking", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.4,<9",
    "lap>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dataset = ["kagglehub>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
e2e = ["playwright>=1.45"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
ppe-guard = "ppe_guard.cli:main"

[project.urls]
Homepage = "https://voxdroid.github.io/ppe-guard/"
Repository = "https://github.com/VoxDroid/ppe-guard"
Issues = "https://github.com/VoxDroid/ppe-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe_guard"]

[tool.hatch.build.targets.sdist]
include = ["src/ppe_guard", "tests", "training/data.yaml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
