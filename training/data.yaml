# Construction Site Safety (CSS) dataset — YOLO detection format.
# Paths are resolved relative to this file, so commands work from any directory.
# Get the images with:  ppe-guard dataset download
train: ../datasets/css/train/images
val: ../datasets/css/valid/images
test: ../datasets/css/test/images

nc: 10
names:
  0: Hardhat
  1: Mask
  2: NO-Hardhat
  3: NO-Mask
  4: NO-Safety Vest
  5: Person
  6: Safety Cone
  7: Safety Vest
  8: machinery
  9: vehicle
